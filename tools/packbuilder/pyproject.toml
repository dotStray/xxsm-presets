[project]
name = "packbuilder"
version = "0.1.0"
description = "Builds the XXSM Game Packs in this repository from public sources and the hand-kept manual/ folder."
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
]

[project.scripts]
packbuilder = "packbuilder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/packbuilder"]
